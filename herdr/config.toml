onboarding = false

[keys]
prefix = "ctrl+q"

# Ghostty と同じキーで操作できるようにする
# Ghostty 側ではこれらのキーを無効にしている（ghostty/config を参照）

# ペイン
split_vertical = ["prefix+v", "cmd+d"]
split_horizontal = ["prefix+minus", "cmd+shift+d"]
cycle_pane_next = ["prefix+tab", "cmd+]"]
cycle_pane_previous = ["prefix+shift+tab", "cmd+["]
focus_pane_left = ["prefix+h", "cmd+alt+left"]
focus_pane_down = ["prefix+j", "cmd+alt+down"]
focus_pane_up = ["prefix+k", "cmd+alt+up"]
focus_pane_right = ["prefix+l", "cmd+alt+right"]
swap_pane_left = "prefix+left"
swap_pane_down = "prefix+down"
swap_pane_up = "prefix+up"
swap_pane_right = "prefix+right"
resize_pane_left = "cmd+ctrl+left"
resize_pane_down = "cmd+ctrl+down"
resize_pane_up = "cmd+ctrl+up"
resize_pane_right = "cmd+ctrl+right"
zoom = ["prefix+z", "cmd+shift+enter"]

# タブ
new_tab = ["prefix+c", "cmd+t"]
next_tab = ["prefix+n", "ctrl+tab", "cmd+shift+]"]
previous_tab = ["prefix+p", "ctrl+shift+tab", "cmd+shift+["]
switch_tab = "cmd+1..9"
rename_tab = ["prefix+shift+t", "cmd+shift+t"]

# スペース
# hint: Ghostty の window 用のキーをスペースの操作に使う
new_workspace = ["prefix+shift+n", "cmd+n"]
next_workspace = "cmd+down"
previous_workspace = "cmd+up"
switch_workspace = "ctrl+1..9"
rename_workspace = ["prefix+shift+w", "cmd+shift+n"]
toggle_sidebar = ["prefix+b", "cmd+b"]

# ペイン、タブ、スペースを閉じるときに、中の nvim を終了するスクリプトを走らせる
close_pane = ""
close_tab = ""
close_workspace = ""

[[keys.command]]
key = "prefix+x"
type = "shell"
command = 'sh "$HOME/dotfiles/herdr/close.sh" pane'
description = "close pane after quitting nvim"

[[keys.command]]
key = "cmd+w"
type = "shell"
command = 'sh "$HOME/dotfiles/herdr/close.sh" pane'
description = "close pane after quitting nvim"

[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = 'sh "$HOME/dotfiles/herdr/close.sh" tab'
description = "close tab after quitting nvim"

[[keys.command]]
key = "cmd+alt+w"
type = "shell"
command = 'sh "$HOME/dotfiles/herdr/close.sh" tab'
description = "close tab after quitting nvim"

[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = 'sh "$HOME/dotfiles/herdr/close.sh" workspace'
description = "close workspace after quitting nvim"

[[keys.command]]
key = "cmd+shift+w"
type = "shell"
command = 'sh "$HOME/dotfiles/herdr/close.sh" workspace'
description = "close workspace after quitting nvim"

# フォーカスしている pane と隣の pane の並びを左右 ⇄ 上下で切り替える
[[keys.command]]
key = "prefix+space"
type = "shell"
command = '"$HOME/dotfiles/herdr/toggle-split.sh"'
description = "toggle pane split direction"

# フォーカスしている pane を、fzf で選んだタブか新しいタブに移す
[[keys.command]]
key = "prefix+m"
type = "popup"
command = '"$HOME/dotfiles/herdr/move-pane.sh"'
description = "move pane to another tab"
width = "80%"
height = "60%"

# option + g でフォーカスしている pane の作業ディレクトリ（worktree）で lazygit を開く
[[keys.command]]
key = "alt+g"
type = "popup"
command = 'sh "$HOME/dotfiles/herdr/lazygit.sh"'
description = "lazygit in focused pane's cwd"
width = "90%"
height = "90%"

[ui.toast]
delivery = "off"

[ui]
mouse_capture = true

[ui.sound]
enabled = false

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]
